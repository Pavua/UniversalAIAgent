name: Tg_python_llm
options:
  bundleIdPrefix: com.example
configs:
  Debug: debug
  Release: release
settings:
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  SWIFT_SERIALIZE_DIAGNOSTICS: 'NO'
  CODE_SIGNING_REQUIRED: 'NO'
  CODE_SIGN_IDENTITY: ''

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI
    majorVersion: 2.0.0
  FirebaseCrashlytics:
    url: https://github.com/firebase/firebase-ios-sdk.git
    majorVersion: 10.0.0

targets:
  Tg_python_llm:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: .
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "UITests_iOS/**"
          - "UITests_watch/**"
          - "Widget/**"
          - "WatchComplication/**"
    dependencies:
      - package: MarkdownUI
      - package: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Tg_python_llm
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Tg_python_llm.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    scripts:
      - name: SwiftGen
        script: swiftgen config run
    resources:
      - Info.plist
      - GoogleService-Info.plist
      - path: .
        includes:
          - "*.lproj/**"
  Tg_python_llmTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: Tests
    dependencies:
      - target: Tg_python_llm
  Tg_python_llmUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: UITests
    dependencies:
      - target: Tg_python_llm
  Tg_python_llm_iOS:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: .
        excludes:
          - Tg_python_llm.xcodeproj/**
          - Tests/**
          - UITests/**
          - UITests_iOS/**
          - UITests_watch/**
    resources:
      - Info.plist
      - GoogleService-Info.plist
    dependencies:
      - package: MarkdownUI
      - package: FirebaseCrashlytics
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.tgpythonllm.ios
    scripts:
      - name: Crashlytics Run
        script: |
          if [ "${CONFIGURATION}" == "Release" ]; then
            ${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run
          fi
  Tg_python_llm_iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: UITests_iOS
    dependencies:
      - target: Tg_python_llm_iOS
  Tg_python_llm_visionOS:
    type: application
    platform: visionOS
    deploymentTarget: '2.0'
    sources:
      - path: .
        excludes:
          - Tg_python_llm.xcodeproj/**
          - Tests/**
          - UITests/**
          - UITests_iOS/**
          - UITests_watch/**
    resources:
      - Info.plist
      - GoogleService-Info.plist
    dependencies:
      - package: MarkdownUI
      - package: FirebaseCrashlytics
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.tgpythonllm.visionos
  Tg_python_llmWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: .
        excludes:
          - Tg_python_llm.xcodeproj/**
          - Tests/**
          - UITests/**
          - UITests_iOS/**
          - UITests_watch/**
    resources:
      - Info.plist
      - GoogleService-Info.plist
    dependencies:
      - package: MarkdownUI
      - package: FirebaseCrashlytics
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.tgpythonllm.watch
  Tg_python_llmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Widget
    dependencies:
      - target: Tg_python_llm
    entitlements:
      path: Widget/Tg_python_llmWidget.entitlements
  # WatchOS Complication extension
  Tg_python_llmWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: WatchComplication
    dependencies:
      - target: Tg_python_llmWatch
    entitlements:
      path: WatchComplication/Tg_python_llmWatchComplication.entitlements

schemes:
  Tg_python_llm:
    build:
      targets:
        Tg_python_llm: all
    test:
      targets:
        Tg_python_llmTests: {}
        Tg_python_llmUITests: {}
  Tg_python_llm_iOS:
    build:
      targets:
        Tg_python_llm_iOS: all
    test:
      targets:
        Tg_python_llm_iOSUITests: {}
  Tg_python_llm_visionOS:
    build:
      targets:
        Tg_python_llm_visionOS: all
  Tg_python_llmWatch:
    build:
      targets:
        Tg_python_llmWatch: all
    test:
      targets: {}
  Tg_python_llmWidget:
    build:
      targets:
        Tg_python_llmWidget: all
    test:
      targets: {}
  Tg_python_llmWatchComplication:
    build:
      targets:
        Tg_python_llmWatchComplication: all
    test:
      targets: {} 