global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'llm-containers'
    static_configs:
      - targets: 
        - 'llama32-main:11434'
        - 'llama32-test:11435' 
        - 'llama32-exp:11436'
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: '/metrics'
    scrape_interval: 60s

  - job_name: 'redis'
    static_configs:
      - targets: ['llm_cache:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s