repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.0
    hooks:
      - id: isort
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        entry: swiftlint
        language: system
        types: [swift]
      - id: swiftgen
        name: swiftgen yml
        entry: swiftgen config lint --config .swiftgen.yml
        language: system
        types: [yaml] 