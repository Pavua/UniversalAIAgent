version: '3.8'

services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: icecream-scheduler
    command:
      - icecream-scheduler
      - --daemon
      - --no-detach
      - --port
      - "8765"
    ports:
      - "8765:8765"
    volumes:
      - ./iceccd-cache:/var/cache/icecc
